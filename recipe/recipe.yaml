# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "4.11.13"
  python_check_max: "3.14"

package:
  name: platformdirs
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/53/0e/7be2983c52622d6c0899300f760e31ba143355cedf1afcb3e65689d5ca85/platformdirs-${{ version }}.tar.gz
  sha256: 6985eefdc2298693e4ce1fe124645524cb967428eb6384e0ce5b49767e7ea8ba

build:
  number: 0
  noarch: python
  script:
    - ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation --disable-pip-version-check

requirements:
  host:
    - hatch-vcs >=0.5
    - hatchling >=1.29
    - pip
    - python ${{ python_min }}.*
  run:
    - python >=${{ python_min }}

tests:
  - python:
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - ${{ python_check_max }}.*
      imports: platformdirs
  - requirements:
      run:
        - mypy
        - python ${{ python_min }}.*
    script:
      - mypy -p platformdirs --ignore-missing-imports --disable-error-code=safe-super ${{ "--exclude=windows" if unix }}

about:
  homepage: https://pypi.org/project/platformdirs
  license_file: LICENSE
  license: MIT
  summary: A small Python module for determining appropriate platform-specific dirs, e.g. a "user data dir".
  repository: https://github.com/tox-dev/platformdirs

extra:
  recipe-maintainers:
    - adament
    - gaborbernat
    - bollwyvl
