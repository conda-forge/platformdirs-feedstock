# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "4.12.0"
  python_check_max: "3.14"

package:
  name: platformdirs
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/p/platformdirs/platformdirs-${{ version }}.tar.gz
  sha256: 095be5c143382b1bee917c4f3e9987a0d8d6a582261f1d061ad0c403b7695b5b

build:
  number: 0
  noarch: python
  script:
    - ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation --disable-pip-version-check --check-build-dependencies

requirements:
  host:
    - hatch-vcs >=0.5
    - hatchling >=1.29
    - pip
    - python ${{ python_min }}.*
  run:
    - python >=${{ python_min }}

tests:
  - package_contents:
      strict: true
      site_packages:
        - platformdirs/**
        - platformdirs-${{ version }}.dist-info/**
  - python:
      imports: platformdirs
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - ${{ python_check_max }}.*
  - requirements:
      run:
        - mypy
        - python ${{ python_min }}.*
    script:
      - mypy -p platformdirs --ignore-missing-imports --disable-error-code=safe-super ${{ "--exclude=windows" if unix }}

about:
  homepage: https://pypi.org/project/platformdirs
  license_file: LICENSE
  license: MIT
  summary: A small Python module for determining appropriate platform-specific dirs, e.g. a "user data dir".
  repository: https://github.com/tox-dev/platformdirs

extra:
  recipe-maintainers:
    - adament
    - gaborbernat
    - bollwyvl
